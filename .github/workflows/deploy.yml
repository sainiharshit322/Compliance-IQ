name: ComplianceIQ CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  test-and-lint:
    name: Run Pytest Suite & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Monorepo Test Suite
        run: |
          pytest --verbose

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install Frontend Dependencies & Build HITL Portal
        run: |
          if [ -f "package.json" ]; then npm install; fi
          if [ -d "apps/hitl_portal" ]; then
            cd apps/hitl_portal && npm install --no-workspaces && npm run build
          fi

  azure-deploy:
    name: Continuous Deployment to Azure Container Apps
    needs: test-and-lint
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy FastAPI Orchestrator API Gateway to Azure Container Apps
        run: |
          az containerapp update --name ca-orchestrator-api-dev --resource-group rg-complianceiq-dev --source .

      - name: Deploy Next.js HITL Portal to Azure Container Apps
        run: |
          az containerapp update --name ca-hitl-portal-dev --resource-group rg-complianceiq-dev --source apps/hitl_portal
