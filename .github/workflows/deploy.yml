name: ComplianceIQ CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-lint:
    name: Run Pytest Suite & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Monorepo Test Suite
        run: |
          pytest --verbose

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install Frontend Dependencies & Build HITL Portal
        run: |
          if [ -f "package.json" ]; then npm install; fi
          if [ -d "apps/hitl_portal" ]; then
            cd apps/hitl_portal && npm install --no-workspaces && npm run build
          fi

  azure-deploy:
    name: Continuous Deployment to Azure Container Apps
    needs: test-and-lint
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Lowercase Repository Name
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build & Push FastAPI Orchestrator API Image
        run: |
          IMAGE_NAME=ghcr.io/${{ steps.repo.outputs.name }}/orchestrator-api:latest
          docker build -t $IMAGE_NAME -f services/orchestrator_api/Dockerfile .
          docker push $IMAGE_NAME

      - name: Deploy FastAPI Orchestrator API Gateway to Azure Container Apps
        run: |
          IMAGE_NAME=ghcr.io/${{ steps.repo.outputs.name }}/orchestrator-api:latest
          az containerapp registry set --name ca-orchestrator-api-dev --resource-group rg-complianceiq-dev --server ghcr.io --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }}
          az containerapp update --name ca-orchestrator-api-dev --resource-group rg-complianceiq-dev --image $IMAGE_NAME --target-port 8000

      - name: Build & Push Next.js HITL Portal Image
        run: |
          IMAGE_NAME=ghcr.io/${{ steps.repo.outputs.name }}/hitl-portal:latest
          docker build -t $IMAGE_NAME -f apps/hitl_portal/Dockerfile apps/hitl_portal
          docker push $IMAGE_NAME

      - name: Deploy Next.js HITL Portal to Azure Container Apps
        run: |
          IMAGE_NAME=ghcr.io/${{ steps.repo.outputs.name }}/hitl-portal:latest
          az containerapp registry set --name ca-hitl-portal-dev --resource-group rg-complianceiq-dev --server ghcr.io --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }}
          az containerapp update --name ca-hitl-portal-dev --resource-group rg-complianceiq-dev --image $IMAGE_NAME --target-port 3000
